plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagement}"
    id 'java'
    id 'com.google.cloud.tools.jib' version "${jlib}"
}

description = 'whitebird-auth-service'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'

    implementation 'org.springframework.cloud:spring-cloud-config-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
//    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-hystrix'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }

    // 第三方包
    implementation project(':whitebird-commons').project('whitebird-jpa-spring-boot-starter')
    implementation project(':whitebird-commons').project('whitebird-core-spring-boot-starter')
    implementation project(':whitebird-commons').project('whitebird-swagger-spring-boot-starter')
    implementation project(':whitebird-commons').project('whitebird-oauth2-spring-boot-starter')

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    implementation "org.apache.commons:commons-collections4:${commonsCollections}"
    implementation "io.springfox:springfox-swagger2:${swagger2}"
    implementation "io.springfox:springfox-swagger-ui:${swagger2}"
    implementation('io.micrometer:micrometer-registry-prometheus')

}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

jib.from.image = "azul/zulu-openjdk-alpine:17"
jib.to.image = "whitebird-auth-service"
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

