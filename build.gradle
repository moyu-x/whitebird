allprojects {
    group 'top.idwangmo.whitebird'
    version '0.0.1'
    apply plugin: 'idea'
    apply plugin: 'java'

    sourceCompatibility = '17'
    targetCompatibility = '17'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        maven { url 'https://maven.aliyun.com/repository/public'}
        mavenLocal()
        mavenCentral()
    }

    ext {
        set('springCloudVersion', "2023.0.2")
        set('springBootVersion', "3.3.1")
        set('springDependencyManagement', "1.1.5")
        set('mapstructVersion', "1.3.1.Final")
        set('commonsCollections', "4.4")
        set('guava', "28.1-jre")
        set('commonsLang', "3.9")
        set('swagger2', "2.9.2")
        set('resilience4jVersion', "1.1.0")
        set('jlib', "1.8.0")
        set('hutool', "5.8.27")
        set('gson', "2.8.6")
        set('javaxServlet', "4.0.1")
        set('findbug', "3.0.1")
    }

    dependencies {
        implementation group: 'jakarta.annotation', name: 'jakarta.annotation-api', version: '3.0.0'
    }

    test {
        useJUnitPlatform()
    }
}